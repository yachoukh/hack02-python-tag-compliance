[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-compliance"
version = "0.1.0"
description = "Beginner Azure tag compliance checker for a GitHub Copilot hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.17.0",
  "azure-mgmt-resource>=26.0.0",
  "pyyaml>=6.0.1",
  "cryptography<50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
tag-compliance = "tag_compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=tag_compliance --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


